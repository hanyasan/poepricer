expose_php = 0
memory_limit = 256M

; The code is baked into the image and never changes at runtime, so PHP does
; not need to stat files on every request.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
