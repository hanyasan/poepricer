; Pool overrides for the production image. Loaded after the image's own
; www.conf / zz-docker.conf (alphabetical order), which still provide
; `listen = 9000` and logging to stderr.
[www]
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5

; Recycle workers so a slow leak never accumulates.
pm.max_requests = 500

; Keep below nginx's fastcgi_read_timeout (60s).
request_terminate_timeout = 60s

; The container configuration arrives as real environment variables.
clear_env = no

; Used by the container healthcheck (cgi-fcgi).
ping.path = /ping
ping.response = pong
