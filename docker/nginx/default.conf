server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    server_tokens off;
    client_max_body_size 10m;

    # Docker's embedded DNS. Together with the variable below it makes nginx
    # re-resolve `app` after the php-fpm container is recreated, instead of
    # keeping the old IP until nginx is reloaded.
    resolver 127.0.0.11 valid=10s;
    set $php_upstream app:9000;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # Only the front controller is ever handed to php-fpm.
    location = /index.php {
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
