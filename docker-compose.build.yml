# Build definitions for the production images, layered over
# docker-compose.prod.yml (which only references them) on a workstation:
#   IMAGE_TAG=<tag> docker compose -f docker-compose.prod.yml -f docker-compose.build.yml build
# docker/deploy.sh does this and ships the result to the server.
# DEPLOY_PLATFORM must match the server's CPU architecture.

services:
  app:
    platform: ${DEPLOY_PLATFORM:-linux/amd64}
    build:
      context: .
      target: production
      args:
        PHP_VARIANT: fpm
        UID: ${UID:-1000}
        GID: ${GID:-1000}

  nginx:
    platform: ${DEPLOY_PLATFORM:-linux/amd64}
    build:
      context: .
      target: nginx
      args:
        PHP_VARIANT: fpm
        UID: ${UID:-1000}
        GID: ${GID:-1000}

  frontend:
    platform: ${DEPLOY_PLATFORM:-linux/amd64}
    build:
      context: ./frontend
      target: production
      args:
        NUXT_API_BASE: http://nginx
